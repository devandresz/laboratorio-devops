
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desarrollo Web | Práctica CI/CD</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1120;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: 720px;
      padding: 48px;
      border: 1px solid #334155;
      border-radius: 20px;
      background: #111c30;
    }
    .tag {
      color: #38bdf8;
      letter-spacing: 3px;
      font-size: 12px;
      font-weight: bold;
    }
    h1 {
      font-size: clamp(32px, 6vw, 56px);
      margin: 20px 0 12px;
    }
    h2 { color: #cbd5e1; font-weight: 400; }
    p { color: #94a3b8; line-height: 1.8; }
    .stack { margin-top: 30px; }
    .stack span {
      display: inline-block;
      padding: 10px 14px;
      margin: 4px;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #7dd3fc;
    }
    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #334155;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <div class="tag">UNIVERSIDAD MARIANO GÁLVEZ</div>

    <h1>Laboratorio DevOps</h1>
    <h2>Desarrollo Web</h2>

    <p>
      Implementación de integración y despliegue
      continuo utilizando contenedores y
      automatización de pruebas.
    </p>

    <div class="stack">
      <span>Docker</span>
      <span>Kubernetes</span>
      <span>GitHub Actions</span>
      <span>CI/CD</span>
    </div>

    <footer>
      <p>Integrantes: Escribir nombres aquí</p>
      <p>26 de octubre de 2026</p>
    </footer>
  </main>
</body>
</html>
